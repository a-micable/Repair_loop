[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repairloop"
version = "0.5.0"
description = "STEM coding agent: write/run/test/repair on NVIDIA Nemotron via Nebius Token Factory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kenneth Kaduki" }]
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.37.0"]
api = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
dev = ["pytest>=8.0"]

[project.scripts]
repairloop = "repairloop.cli:main"
labforge-api = "repairloop.api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repairloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
