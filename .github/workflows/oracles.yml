name: oracles

on:
  push:
  pull_request:

jobs:
  prove-graders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m repairloop.eval --oracles-only
      - run: pytest -q
